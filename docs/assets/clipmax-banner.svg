<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Clipmax Studio — Find your next big moment.</title>
  <desc id="desc">A dark studio banner with lime accents and a vertical video workflow.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#293429"/></pattern>
    <linearGradient id="glow"><stop stop-color="#c6f56b"/><stop offset="1" stop-color="#89b949"/></linearGradient>
  </defs>
  <rect width="1280" height="440" rx="24" fill="#111516"/>
  <rect x="720" width="560" height="440" rx="24" fill="url(#dots)"/>
  <g stroke="#c6f56b" stroke-width="3" transform="translate(70 65)"><path d="M20 0v40M0 20h40M6 6l28 28M6 34L34 6"/></g>
  <text x="130" y="99" fill="#f4f7ef" font-family="Arial,sans-serif" font-size="42" font-weight="700">clipmax<tspan fill="#c6f56b">.</tspan></text>
  <text x="70" y="160" fill="#a8b39d" font-family="Arial,sans-serif" font-size="12" letter-spacing="4">POWERED BY ANTIGRAVITY CLI</text>
  <text x="67" y="225" fill="#f4f7ef" font-family="Arial,sans-serif" font-size="52" font-weight="700">Find your next</text>
  <text x="67" y="286" fill="#c6f56b" font-family="Georgia,serif" font-size="57" font-style="italic">big moment.</text>
  <text x="70" y="333" fill="#aeb6ac" font-family="Arial,sans-serif" font-size="18">Long videos. Complete stories. Ready-to-share clips.</text>
  <rect x="70" y="365" width="303" height="34" rx="17" fill="#26301f"/>
  <text x="89" y="387" fill="#c6f56b" font-family="Arial,sans-serif" font-size="13">LOCAL CAPTIONS   /   REAL PROGRESS   /   DOCKER</text>
  <path d="M970 103v36m0 55v35m0 55v32m0 0h-105v27m105-27h105v27" fill="none" stroke="#79945a" stroke-width="2"/>
  <g font-family="Arial,sans-serif" font-size="15" text-anchor="middle">
    <rect x="853" y="48" width="234" height="58" rx="12" fill="#293720" stroke="#a1cb5a"/><text x="970" y="83" fill="#e9f3db">01 / Import your video</text>
    <rect x="853" y="139" width="234" height="58" rx="12" fill="#1b241b" stroke="#4d6340"/><text x="970" y="174" fill="#e9f3db">02 / Find the complete story</text>
    <rect x="853" y="229" width="234" height="58" rx="12" fill="#1b241b" stroke="#4d6340"/><text x="970" y="264" fill="#e9f3db">03 / Frame, caption and mix</text>
    <rect x="771" y="344" width="188" height="57" rx="12" fill="#c6f56b"/><text x="865" y="378" fill="#1a2512" font-weight="700">Preview your clips</text>
    <rect x="981" y="344" width="188" height="57" rx="12" fill="#1b241b" stroke="#4d6340"/><text x="1075" y="378" fill="#e9f3db">Publish your moment</text>
  </g>
</svg>
